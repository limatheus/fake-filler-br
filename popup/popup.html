<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Filler BR</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 2L2 7L11 12L20 7L11 2Z" fill="#10B981"/>
          <path d="M2 17L11 22L20 17" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L11 17L20 12" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Fake Filler BR</h1>
      </div>
      <p class="subtitle">Preenchimento com dados brasileiros</p>
    </header>

    <main>
      <button id="fill-btn" class="primary-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        Preencher Página (Alt+Shift+B)
      </button>

      <div class="info-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <p>A extensão detecta automaticamente se o campo aceita pontuação com base no maxlength.</p>
      </div>
    </main>
    
    <footer>
      <p>Made with ❤️ by <a href="https://github.com/limatheus" target="_blank" style="color: #10B981; text-decoration: none; font-weight: 500;">limatheus</a></p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
